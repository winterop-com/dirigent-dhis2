name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: "**/uv.lock"
      - name: Sync
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types (mypy)
        run: uv run mypy
      - name: Types (pyright)
        run: uv run pyright
      - name: Test
        run: uv run pytest
