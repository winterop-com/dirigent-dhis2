# Verify data-element metadata against the dhis2-data-elements instance schema.
#
# The same check as data-elements-carried.yaml, written the other way: rather than carrying
# the shape, the gate names dhis2-data-elements, a schema the instance holds. The document
# stays short, the shape lives in one place many pipelines can point at, and requires.schemas
# refuses the document on an instance that does not hold it.
#
#   dg run --local --schema examples/schemas/dhis2-data-elements.json \
#     examples/validate/data-elements-named.yaml

format: dirigent/v1
kind: pipeline
code: data-elements-named
name: Data elements, checked against a named schema
description: Fetch DHIS2 data elements and validate them against the dhis2-data-elements schema the instance holds.

tags: [dhis2, validate, http]

requires:
  blocks:
    - http.request
    - validate.schema
  schemas:
    - dhis2-data-elements

connections:
  dhis2-demo:
    kind: http
    config:
      base_url: https://play.im.dhis2.org/stable-2-43-1
      basic_username: admin
      basic_password: district
      timeout: 1m

steps:
  fetch:
    block: http.request
    config:
      connection: dhis2-demo
      path: /api/dataElements.json
      method: GET
      query:
        fields: id,name,valueType,domainType
        paging: false
  check:
    block: validate.schema
    depends_on: [fetch]
    config:
      input: ${steps.fetch.output.json_body}
      schema: dhis2-data-elements
