# Move a data value set between two instances without holding it in memory.
#
# The export writes to storage and the import reads back from it: save_to on one side,
# source_uri on the other, and the values never ride through the run's outputs at all. That
# is what makes this the shape a real migration takes -- a national instance's district
# export is not something to carry in a step's output, and neither step's memory bounds how
# much moves.
#
# An import takes data_values or source_uri, never both and never neither; a step naming
# both is refused when the document is applied rather than at three in the morning. The file
# at source_uri has to be a JSON data value set -- what the export wrote -- and anything else
# is rejected rather than retried.
#
# Both steps point at the same demo connection here so the example runs standalone. The real
# document names two: read from source, write to target. Repointing the import's connection
# is the whole edit, which is the argument for naming a connection rather than writing a URL
# into a step.
#
#   dg run --local examples/dhis2/dhis2-import-from-storage.yaml

format: dirigent/v1
kind: pipeline
code: dhis2-import-from-storage
name: Move a data value set through storage
description: Export a data value set to storage, then import it back from there as a dry run.

tags: [dhis2, storage]

requires:
  blocks:
    - dhis2.data_value_set_export
    - dhis2.data_value_set_import

params:
  type: object
  properties:
    period:
      type: string
      default: "202507"
      description: The ISO period to move.

connections:
  dhis2-demo:
    kind: dhis2
    config:
      base_url: https://play.im.dhis2.org/stable-2-43-1
      basic_username: admin
      basic_password: district
      timeout: 120s

steps:
  export:
    block: dhis2.data_value_set_export
    config:
      connection: dhis2-demo
      data_set: BfMAe6Itzgt
      period: "${params.period}"
      org_unit: DiszpKrYNg8
      save_to: "${run.scratch}/dhis2/child-health-${params.period}.json"

  load:
    block: dhis2.data_value_set_import
    depends_on: [export]
    config:
      connection: dhis2-demo
      # The export's own body_uri rather than the literal path: one step says where the file
      # went, the next reads it from there.
      source_uri: "${steps.export.output.body_uri}"
      import_strategy: CREATE_AND_UPDATE
      # The demo is shared, and this document sends it its own data back. Point the import
      # at your own instance before turning this off.
      dry_run: true
