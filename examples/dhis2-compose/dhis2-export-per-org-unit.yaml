# Run the same export once per organisation unit, each its own attempt.
#
# One district's export failing should not cost the other twelve their exports, and a single
# step reading thirteen districts at once cannot offer that: it either succeeds or it does
# not. for_each is what splits it into thirteen, each with its own attempt, its own retry
# budget and its own place in the run.
#
# The list is expanded when the run is created, which is why it reads params rather than
# another step's output: the run's item grid has to exist from the moment the run is visible,
# and that is what makes an item's progress something a person can watch. Fanning out over
# something only a previous step knows -- the org units a metadata read returned -- is a
# different shape: the reading pipeline triggers the fanning-out one, or the list is passed
# in as a param.
#
# items: continue is the policy that makes the fan-out worth having. Under the default,
# fail_fast, one district refusing fails the whole step. Under continue the failure is
# recorded against that item, the rest finish, and the run reports completed_with_errors --
# an honest ending, neither a green run that hid a gap nor a red one that threw away twelve
# good exports.
#
# What that costs downstream is worth knowing before relying on it: the step still counts as
# succeeded, and its output is the list of its items' outputs with the failed ones absent --
# not null, absent. A step reading the batch therefore sees only what worked, and has to
# treat a short list as the normal case.
#
# Each district's export is written to its own file by a second fanned step. for_each:
# ${steps.export.items} maps the write over the export's grid rather than a list of its own,
# so district i's file is written from district i's export -- ${steps.export.item.output} is
# the matching item, not the batch. The grid is the export's, fixed when the run was created,
# which is why the adopted step has to name the export in depends_on directly and may not
# carry rule: one_failed. Under items: continue a district whose export failed has its write
# skipped rather than failed, so the manifest lists what did land, and a short manifest is
# the normal case rather than an error.
#
#   dg run --local examples/dhis2-compose/dhis2-export-per-org-unit.yaml
#   dg run --local examples/dhis2-compose/dhis2-export-per-org-unit.yaml \
#     -p org_units='["O6uvpzGd5pu","fdc6uOvgoji"]'

format: dirigent/v1
kind: pipeline
code: dhis2-export-per-org-unit
name: One export per organisation unit
description: Fan a data value set export out over several organisation units, one run item each.

tags: [dhis2, storage]

requires:
  blocks:
    - dhis2.data_value_set_export
    - storage.write
    - transform.jq

params:
  type: object
  properties:
    period:
      type: string
      default: "202507"
      description: The ISO period each item exports.
    org_units:
      type: array
      items:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9]{10}$"
      default: [O6uvpzGd5pu, fdc6uOvgoji, lc3eMKXaEfw]
      description: The uids to export, one run item each. Bo, Bombali and Bonthe by default.

connections:
  dhis2-demo:
    kind: dhis2
    config:
      base_url: https://play.im.dhis2.org/stable-2-43-1
      basic_username: admin
      basic_password: district
      timeout: 120s

steps:
  export:
    block: dhis2.data_value_set_export
    for_each: "${params.org_units}"
    items: continue
    # Per item, not per step: one district timing out costs that district a retry and leaves
    # the others alone.
    retry:
      max_attempts: 3
      backoff: 30s
    config:
      connection: dhis2-demo
      data_set: BfMAe6Itzgt
      period: "${params.period}"
      org_unit: "${item}"
      children: true

  write_one:
    block: storage.write
    depends_on: [export]
    # The export's grid, so this item is that item: the same org unit, the same index.
    for_each: "${steps.export.items}"
    items: continue
    config:
      target: "${run.scratch}/dhis2/${params.period}/${item}.json"
      # The matching item's output, not the batch: .item.output is district i's export.
      value: ${steps.export.item.output.body}

  manifest:
    block: transform.jq
    depends_on: [write_one]
    config:
      # The write's output is the list of its items' outputs, the skipped ones absent, so
      # this is what landed.
      input: ${steps.write_one.output}
      program: '{files: length, uris: [.[].uri], total_bytes: ([.[].bytes_written] | add // 0)}'
