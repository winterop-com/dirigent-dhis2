# Move a data value set between instances with the file it travelled as kept on the way.
#
# Storage has two doors and each is a step, so the move is four hops:
#
#   export  dhis2.data_value_set_export. Output: body, the document the instance answered
#           with.
#   save    storage.write. That body out at a URI.
#   reload  storage.read. The same URI back in, decoded by its extension into `value`.
#   load    dhis2.data_value_set_import. The value as the document to send.
#
# The saved file is the point of the shape: it is what a person reads when the import
# disagrees with the export, and what a re-run sends again without asking the source
# instance for the month a second time.
#
# HOW MUCH THIS MOVES. Every hop passes through the worker, so the month has to fit in it.
# A national instance's whole export does not, and is moved a district at a time instead.
#
# TO MAKE IT YOURS: create the `dhis2` connection, point the import at a second connection
# so the two ends are different instances, and choose a durable target for the save if the
# file should outlive the run's scratch space.

format: dirigent/v1
kind: pipeline
code: dhis2-export-through-storage
name: Move a data value set through storage
description: Export a data value set, write it to storage, read it back, and import it.

tags: [dhis2, storage, starter]

requires:
  blocks:
    - dhis2.data_value_set_export
    - dhis2.data_value_set_import
    - storage.write
    - storage.read
  connections:
    - dhis2

params:
  type: object
  properties:
    period:
      type: string
      default: "202507"
      description: The ISO period to move.

steps:
  export:
    block: dhis2.data_value_set_export
    config:
      connection: dhis2
      data_set: BfMAe6Itzgt
      period: ${params.period}
      org_unit: DiszpKrYNg8

  save:
    block: storage.write
    depends_on: [export]
    config:
      target: "${run.scratch}/dhis2/data-values-${params.period}.json"
      value: ${steps.export.output.body}

  reload:
    block: storage.read
    depends_on: [save]
    config:
      # The URI the write decided rather than the literal path: one step says where the file
      # went, the next reads it from there.
      source: ${steps.save.output.uri}
      max_size: 8mb

  load:
    block: dhis2.data_value_set_import
    depends_on: [reload]
    config:
      connection: dhis2
      data_values: ${steps.reload.output.value}
      import_strategy: CREATE_AND_UPDATE
      dry_run: true
