# Move a data value set between two instances, through a file on the way.
#
# The document that moves data between instances is four hops, because storage has two doors
# and each is a step:
#
#   export  dhis2.data_value_set_export. Output: body, the document the instance answered
#           with.
#   save    storage.write. That body out at a URI. Output: uri, bytes_written, content_type.
#   reload  storage.read. The same URI back in. The object is application/json by its
#           extension, so the read decodes it and answers with `value`; max_size is how much
#           of it this step will hold, and an object past it is refused rather than truncated.
#   load    dhis2.data_value_set_import. The value as the document to send.
#
# The saved file is the point of the shape: it is what a person reads when the import
# disagrees with the export, and what a re-run sends again without asking the source instance
# for the month a second time.
#
# HOW MUCH THIS MOVES. Every hop passes through the worker, so the month has to fit in it --
# a national instance's whole export does not, and is moved a district at a time instead,
# which dhis2-export-per-org-unit.yaml fans out.
#
# Both steps point at the same demo connection here so the example runs standalone. The real
# document names two: read from source, write to target. Repointing the import's connection
# is the whole edit, which is the argument for naming a connection rather than writing a URL
# into a step.
#
# The document carries no credential. It names the dhis2 connection dhis2-play, which the
# instance holds: create it once, and the command asks how to sign in. The demo takes
# the login it publishes on its own sign-in page.
#
#   dg connection create dhis2 dhis2-play --set base_url=https://play.dhis2.org/2.43 \
#       --set timeout=2m
#
#   dg run examples/dhis2-compose/dhis2-import-from-storage.yaml
#
# TO MAKE IT YOURS: create a `dhis2` connection for your own instance -- `dg connection create
# dhis2 my-dhis2 --set base_url=https://dhis2.example.org` -- and name it in a copy in place of
# `dhis2-play`. Then point the import at a second connection so the two ends are different
# instances, and choose a durable target for the save if the file should outlive the run's
# scratch space.

format: dirigent/v1
kind: pipeline
code: dhis2-import-from-storage
name: Move a data value set through storage
description: |
  Export data values, save them to a file, read it back, and rehearse the import.

  The export is written to storage and read back, and the import is a dry run.

tags: [dhis2, storage, starter]

requires:
  blocks:
    - dhis2.data_value_set_export
    - dhis2.data_value_set_import
    - storage.write
    - storage.read
  connections:
    - dhis2-play

params:
  type: object
  properties:
    period:
      type: string
      default: "202507"
      description: The ISO period to move.

steps:
  export:
    block: dhis2.data_value_set_export
    config:
      connection: dhis2-play
      data_set: BfMAe6Itzgt
      period: "${params.period}"
      org_unit: DiszpKrYNg8

  save:
    block: storage.write
    depends_on: [export]
    config:
      target: "${run.scratch}/dhis2/child-health-${params.period}.json"
      value: ${steps.export.output.body}

  reload:
    block: storage.read
    depends_on: [save]
    config:
      # The URI the write decided rather than the literal path: one step says where the file
      # went, the next reads it from there.
      source: ${steps.save.output.uri}
      max_size: 8mb

  load:
    block: dhis2.data_value_set_import
    depends_on: [reload]
    config:
      connection: dhis2-play
      data_values: ${steps.reload.output.value}
      import_strategy: CREATE_AND_UPDATE
      # The demo is shared, and this document sends it its own data back. Point the import
      # at your own instance before turning this off.
      dry_run: true
