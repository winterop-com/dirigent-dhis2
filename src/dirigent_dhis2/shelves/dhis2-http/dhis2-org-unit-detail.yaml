# Read one organisation unit and its immediate children from the public DHIS2 demo.
#
# The default id is Sierra Leone, the root of the demo hierarchy. Override it with any DHIS2
# organisation-unit uid to inspect another branch. The id is substituted into the request
# path as one value; it is not interpreted as an expression or executable URL fragment.
#
# The document carries no credential. It names the http connection dhis2-play-http, which the
# instance holds: create it once, and the command asks how to sign in. The demo takes
# the login it publishes on its own sign-in page.
#
#   dg connection create http dhis2-play-http --set base_url=https://play.dhis2.org/2.43 \
#       --set follow_redirects_with_auth=true --set timeout=2m
#
#   dg run examples/dhis2-http/dhis2-org-unit-detail.yaml
#
#   dg run examples/dhis2-http/dhis2-org-unit-detail.yaml -p org_unit=O6uvpzGd5pu

format: dirigent/v1
kind: pipeline
code: dhis2-org-unit-detail
name: Org unit detail
description: Read one organisation unit, its hierarchy path, and its immediate children.

tags: [dhis2, http]

requires:
  blocks:
    - http.request
  connections:
    - dhis2-play-http

params:
  type: object
  additionalProperties: false
  properties:
    org_unit:
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9]{10}$"
      default: ImspTQPwCqd
      description: The uid of the organisation unit to inspect.

steps:
  read_org_unit:
    block: http.request
    config:
      connection: dhis2-play-http
      path: "/api/organisationUnits/${params.org_unit}.json"
      method: GET
      query:
        fields: id,displayName,level,path,children[id,displayName]
