# Read a DHIS2 data value set and gate every value on DHIS2's own id and period formats.
#
# The carried schema pins dataElement and orgUnit to format: dhis2-uid and period to
# format: dhis2-period -- formats this pack contributes -- so a value whose dataElement is not
# a real 11-character UID, or whose period is not a DHIS2 ISO period, is refused at the gate
# instead of imported downstream. DHIS2 2.43 writes the period, and the org unit of a
# one-unit export, once on the set rather than on every value, where 2.42 repeats them per
# value; the schema checks them wherever they are, so the gate holds on both.
#
# The schema travels in the document's own top-level schemas: section, so the run needs no
# schema handed to it; that also means a --local run.
#
#   dg run --local examples/dhis2-http/dhis2-data-values-validated.yaml

format: dirigent/v1
kind: pipeline
code: dhis2-data-values-validated
name: Data values, id- and period-checked
description: |
  Fetch a data value set and check its ids and periods against DHIS2's formats.

  The carried schema holds them to `dhis2-uid` and `dhis2-period`, the formats this pack
  contributes.

tags: [dhis2, http, validate]

requires:
  blocks:
    - http.request
    - validate.schema

connections:
  dhis2-demo:
    name: DHIS2 play demo
    description: The public DHIS2 demo at play.dhis2.org, signed in with its documented demo login.
    kind: http
    config:
      base_url: https://play.dhis2.org/2.43
      follow_redirects_with_auth: true
      basic_username: admin
      basic_password: district
      timeout: 60s

schemas:
  dhis2-data-value-set:
    title: DHIS2 data value set
    description: "The envelope GET /api/dataValueSets answers with: the data set, period and organisation unit that were asked for, and the values recorded there. Every identifier is held to the DHIS2 uid format and every period to the DHIS2 period format, so a payload that has moved out from under a pipeline is refused at the gate rather than imported downstream."
    type: object
    required: [dataValues]
    properties:
      dataElement: { type: string, format: dhis2-uid }
      period: { type: string, format: dhis2-period }
      orgUnit: { type: string, format: dhis2-uid }
      dataValues:
        type: array
        items:
          type: object
          required: [dataElement, value]
          properties:
            dataElement: { type: string, format: dhis2-uid }
            period: { type: string, format: dhis2-period }
            orgUnit: { type: string, format: dhis2-uid }
            value: { type: string }

steps:
  fetch:
    block: http.request
    config:
      connection: dhis2-demo
      path: /api/dataValueSets.json
      method: GET
      query:
        dataSet: BfMAe6Itzgt
        period: 202401
        orgUnit: DiszpKrYNg8
  gate:
    block: validate.schema
    depends_on: [fetch]
    config:
      input: ${steps.fetch.output.body}
      schema: dhis2-data-value-set
