# List the organisation-unit levels configured by the public DHIS2 demo.
#
# DHIS2 metadata collections are ordinary HTTP resources. fields keeps the response focused,
# while paging: false asks for the complete four-level hierarchy definition in one response.
#
# The document carries no credential. It names the http connection dhis2-play-http, which the
# instance holds: create it once, and the command asks how to sign in. The demo takes
# the login it publishes on its own sign-in page.
#
#   dg connection create http dhis2-play-http --set base_url=https://play.dhis2.org/2.43 \
#       --set follow_redirects_with_auth=true --set timeout=2m
#
#   dg run examples/dhis2-http/dhis2-org-unit-levels.yaml

format: dirigent/v1
kind: pipeline
code: dhis2-org-unit-levels
name: Org unit levels
description: List the levels that give the DHIS2 organisation-unit hierarchy its shape.

tags: [dhis2, http]

requires:
  blocks:
    - http.request
  connections:
    - dhis2-play-http

steps:
  list_levels:
    block: http.request
    config:
      connection: dhis2-play-http
      path: /api/organisationUnitLevels.json
      method: GET
      query:
        fields: id,name,level
        paging: false
