# Authenticate to the public DHIS2 demo and read its system information.
#
# This is the smallest DHIS2 pipeline: one generic HTTP request through a named connection.
# The response identifies the DHIS2 version, revision, server time, and database platform.
#
# The document carries no credential. It names the http connection dhis2-play-http, which the
# instance holds: create it once, and the command asks how to sign in. The demo takes
# the login it publishes on its own sign-in page.
#
#   dg connection create http dhis2-play-http --set base_url=https://play.dhis2.org/2.43 \
#       --set follow_redirects_with_auth=true --set timeout=2m
#
#   dg run examples/dhis2-http/dhis2-system-info.yaml

format: dirigent/v1
kind: pipeline
code: dhis2-system-info
name: DHIS2 system info
description: Authenticate to DHIS2 and report the instance version and system information.

tags: [dhis2, http]

requires:
  blocks:
    - http.request
  connections:
    - dhis2-play-http

steps:
  read_system_info:
    block: http.request
    config:
      connection: dhis2-play-http
      path: /api/system/info
      method: GET
