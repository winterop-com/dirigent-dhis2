# Reopen a signed-off period: unmake a completion registration.
#
# A month gets signed off and then a correction arrives. Reopening the window is a real
# operation with two spellings on the DHIS2 API, and which one an instance honours depends
# on its version, so a pipeline that reopens windows should know both.
#
# The first is a POST of the same registration with completed: false. The record stays and
# carries a flag saying the sign-off was withdrawn, which is the version worth preferring:
# something remains to say the window was once closed, and the native
# dhis2.data_set_complete sensor reads that flag and goes on waiting rather than treating
# the leftover record as a completion.
#
# The second is DELETE /api/completeDataSetRegistrations with ds, pe, ou and cc as query
# parameters, which removes the registration outright. It leaves the cleanest state and the
# least history: afterwards nothing distinguishes a window that was reopened from one nobody
# ever signed off.
#
# This document builds both, in that order, so the shapes sit side by side. Both go to the
# playground: this directory does not write to the shared play demo. Repoint the reporting
# connection and change each path to /api/completeDataSetRegistrations to perform the real
# thing -- and send one of the two, not both.
#
# NEEDS AN INSTANCE TO CALL. The playground is served by every dirigent instance under
# /api/v1/playground, unauthenticated, so both writes are real requests that never leave your
# machine. Start one first, in the project this runs from:
#
#   dg dev
#
# The run is made on that instance, which serves the playground itself; the reads still go
# to the public demo.
#
# The document carries no credential. It names the connections dhis2-play-http and reporting,
# which the instance holds: create each once. The command asks how to sign in where one
# needs a credential, and the demo takes the login it publishes on its own sign-in page.
#
#   dg connection create http dhis2-play-http --set base_url=https://play.dhis2.org/2.43 \
#       --set follow_redirects_with_auth=true --set timeout=2m
#   dg connection create http reporting --set base_url=http://127.0.0.1:3333/api/v1/playground \
#       --set timeout=30s
#
#   dg run examples/dhis2-http/dhis2-mark-data-set-incomplete.yaml

format: dirigent/v1
kind: pipeline
code: dhis2-mark-data-set-incomplete
name: Reopen a signed-off period
description: |
  Reopen a signed-off period, by withdrawing the sign-off and by deleting it.

  Builds both ways of unmaking a DHIS2 completion registration: a POST with `completed: false`,
  which keeps the record, and a DELETE, which removes it. Both go to the playground; against a
  real instance, send one of the two.

tags: [dhis2, http]

requires:
  blocks:
    - http.request
  connections:
    - dhis2-play-http
    - reporting

params:
  type: object
  properties:
    data_set:
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9]{10}$"
      default: BfMAe6Itzgt
      description: The uid of the data set being reopened.
    period:
      type: string
      default: "202507"
      description: The ISO period being reopened.
    org_unit:
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9]{10}$"
      default: vSbt6cezomG
      description: The uid of the organisation unit whose sign-off is withdrawn.

steps:
  read_registration:
    block: http.request
    config:
      connection: dhis2-play-http
      path: /api/completeDataSetRegistrations
      method: GET
      query:
        dataSet: "${params.data_set}"
        period: "${params.period}"
        orgUnit: "${params.org_unit}"

  # The record kept, the sign-off withdrawn: the same POST body as a completion with the
  # flag inverted.
  withdraw:
    block: http.request
    depends_on: [read_registration]
    config:
      connection: reporting
      path: /request
      method: POST
      body:
        completeDataSetRegistrations:
          - dataSet: "${params.data_set}"
            period: "${params.period}"
            organisationUnit: "${params.org_unit}"
            attributeOptionCombo: HllvX50cXC0
            completed: false

  # The record removed. No body: the registration is addressed entirely by the query. The
  # read above spells the same three as dataSet, period and orgUnit; DELETE shortens them to ds,
  # pe and ou, and adds the attribute option combo as cc.
  erase:
    block: http.request
    depends_on: [withdraw]
    config:
      connection: reporting
      path: /request
      method: DELETE
      query:
        ds: "${params.data_set}"
        pe: "${params.period}"
        ou: "${params.org_unit}"
        cc: HllvX50cXC0
