# Read a slice of metadata, then hand it straight back as a validated update.
#
# dhis2.metadata_export answers its collections keyed by name, which is the bundle shape
# dhis2.metadata_import sends, so the export's collections output is a bundle as it stands.
# Reading with fields ':owner' keeps every property the object owns and nothing computed,
# which is what an import expects.
#
# Validated with UPDATE, the report counts how many objects would be updated and names any
# the instance would refuse. On a real migration the export reads one instance and the import
# writes another, each through its own connection.
#
# The document carries no credential. It names the dhis2 connection dhis2-play, which the
# instance holds: create it once, and the command asks how to sign in. The demo takes
# the login it publishes on its own sign-in page.
#
#   dg connection create dhis2 dhis2-play --set base_url=https://play.dhis2.org/2.43 \
#       --set timeout=2m
#
#   dg run examples/dhis2/dhis2-metadata-round-trip.yaml

format: dirigent/v1
kind: pipeline
code: dhis2-metadata-round-trip
name: Round-trip metadata
description: |
  Export a few data elements, then validate them as an update, writing nothing.

tags: [dhis2]

requires:
  blocks:
    - dhis2.metadata_export
    - dhis2.metadata_import
  connections:
    - dhis2-play

steps:
  export:
    block: dhis2.metadata_export
    config:
      connection: dhis2-play
      resources:
        dataElements:
          filter: name:like:ANC
      fields: ":owner"
  validate:
    block: dhis2.metadata_import
    depends_on: [export]
    config:
      connection: dhis2-play
      metadata: ${steps.export.output.collections}
      import_strategy: UPDATE
      dry_run: true
