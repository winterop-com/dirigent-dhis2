# Wait for a month to be signed off, then read it.
#
# dhis2.data_set_complete is a sensor: each poke is one read-only question to the
# instance -- is this data set, for this period, at this organisation unit, marked
# complete? -- and the run holds at the gate until the answer is yes. The export behind
# it then reads a month somebody has stood behind, not a month still being typed in.
#
# The demo ships with this month already signed off at this facility, so the gate opens
# on the first poke. Against a real instance the deadline is the interesting part: a
# month nobody signs off inside two days skips the run rather than failing it.
#
# The document carries no credential. It names the dhis2 connection dhis2-play, which the
# instance holds: create it once, and the command asks how to sign in. The demo takes
# the login it publishes on its own sign-in page.
#
#   dg connection create dhis2 dhis2-play --set base_url=https://play.dhis2.org/2.43 \
#       --set timeout=2m
#
#   dg run examples/dhis2/dhis2-complete-then-export.yaml
#
# TO MAKE IT YOURS: create a `dhis2` connection for your own instance -- `dg connection create
# dhis2 my-dhis2 --set base_url=https://dhis2.example.org` -- and name it in a copy in place of
# `dhis2-play`. Then name the data set and facility you are waiting on, take the period from a
# param or a schedule's window, and put whatever consumes the month -- an import into a
# warehouse, a report, a file on a share -- behind the export.

format: dirigent/v1
kind: pipeline
code: dhis2-complete-then-export
name: A signed-off month, then the data
description: Wait for a data set to be marked complete, then export it.

tags: [dhis2, sensor, starter]

requires:
  blocks:
    - dhis2.data_set_complete
    - dhis2.data_value_set_export
  connections:
    - dhis2-play

steps:
  signed_off:
    block: dhis2.data_set_complete
    poll: 1m
    deadline: 48h
    on_timeout: skip
    config:
      connection: dhis2-play
      data_set: BfMAe6Itzgt
      period: "202507"
      org_unit: vSbt6cezomG
  read:
    block: dhis2.data_value_set_export
    depends_on: [signed_off]
    config:
      connection: dhis2-play
      data_set: BfMAe6Itzgt
      period: "202507"
      org_unit: vSbt6cezomG
