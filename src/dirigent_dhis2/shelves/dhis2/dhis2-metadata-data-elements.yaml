# Read the data elements straight off the demo, through the version-bound accessor.
#
# dhis2.metadata resolves the instance's version on connect and reads the collection
# named `resource` through that version's generic accessor, so the same document reads a
# 2.42 or a 2.43 instance without a change. The whole collection comes back inline;
# `fields` narrows each row to the columns a downstream step reads.
#
# The document carries no credential. It names the dhis2 connection dhis2-play, which the
# instance holds: create it once, and the command asks how to sign in. The demo takes
# the login it publishes on its own sign-in page.
#
#   dg connection create dhis2 dhis2-play --set base_url=https://play.dhis2.org/2.43 \
#       --set timeout=2m
#
#   dg run examples/dhis2/dhis2-metadata-data-elements.yaml

format: dirigent/v1
kind: pipeline
code: dhis2-metadata-data-elements
name: Read DHIS2 data elements
description: |
  List the data elements on the DHIS2 demo instance.

  Reads the `dataElements` metadata collection.

tags: [dhis2]

requires:
  blocks:
    - dhis2.metadata
  connections:
    - dhis2-play

steps:
  read:
    block: dhis2.metadata
    config:
      connection: dhis2-play
      resource: dataElements
      fields: id,name,valueType,domainType
      order: name:asc
