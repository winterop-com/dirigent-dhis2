# Send one event to the tracker importer, as a rehearsal.
#
# dhis2.tracker_import posts a tracker bundle -- trackedEntities, enrollments, events and
# relationships, in DHIS2's own shape -- to /api/tracker. DHIS2 runs the import as a background
# job, and the step hands that job to the engine to follow: each probe reads the job's
# notifications, and the finished job's report is read into the step's output. No worker is
# held while the instance works.
#
# dry_run sends importMode=VALIDATE, so the instance runs every validation and writes nothing.
# A report whose status is ERROR fails the step, naming each refused object with the
# instance's reason and code, such as E1303 for a compulsory data element left out.
#
# eBAyeGv0exc is the demo's inpatient event programme, Zj7UnCAulEk its one stage, and
# DiszpKrYNg8 Ngelehun CHC, which the programme is assigned to. The stage validates on insert,
# so even an ACTIVE event carries its four compulsory data elements: admission and discharge
# dates, the mode of discharge and an ICD-10 diagnosis, each an option code of its option set.
#
#   dg run --local examples/dhis2/dhis2-tracker-import-dry-run.yaml

format: dirigent/v1
kind: pipeline
code: dhis2-tracker-import-dry-run
name: Rehearse a tracker import
description: |
  Validate one event against the tracker importer, writing nothing.

tags: [dhis2]

requires:
  blocks:
    - dhis2.tracker_import

params:
  type: object
  properties:
    occurred_at:
      type: string
      default: "2025-07-01"
      description: The date the event happened, which is also the admission date.
    discharged_at:
      type: string
      default: "2025-07-04"
      description: The date the patient was discharged.

connections:
  dhis2-demo:
    name: DHIS2 play demo
    description: The public DHIS2 demo at play.dhis2.org, signed in with its documented demo login.
    kind: dhis2
    config:
      base_url: https://play.dhis2.org/2.43
      basic_username: admin
      basic_password: district
      timeout: 60s

steps:
  rehearse:
    block: dhis2.tracker_import
    poll: 5s
    config:
      connection: dhis2-demo
      tracker:
        events:
          - program: eBAyeGv0exc
            programStage: Zj7UnCAulEk
            orgUnit: DiszpKrYNg8
            occurredAt: "${params.occurred_at}"
            status: ACTIVE
            dataValues:
              # Age in years.
              - dataElement: qrur9Dvnyt5
                value: "34"
              # Admission date.
              - dataElement: eMyVanycQSC
                value: "${params.occurred_at}"
              # Discharge date.
              - dataElement: msodh3rEMJa
                value: "${params.discharged_at}"
              # Mode of discharge: discharged.
              - dataElement: fWIAEtYVEGk
                value: MODDISCH
              # Diagnosis (ICD-10): cholera due to Vibrio cholerae 01.
              - dataElement: K6uUAvq500H
                value: A000
      dry_run: true
