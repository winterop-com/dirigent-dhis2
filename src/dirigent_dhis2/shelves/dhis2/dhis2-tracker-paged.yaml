# Read one page of a collection too large to read whole.
#
# A tracker read is paged whether or not the document says so, and page_size is the setting
# that decides how much of it arrives at once. The instance's own default is small; a
# generous page size means fewer round trips and a larger response to hold, and there is a
# ceiling above which the instance refuses or the read times out.
#
# This document reads one page deliberately. The pager that comes back beside the rows is what
# tells a reader where they are: pager.more says whether rows match past this page, and with
# total: true the instance also counts them, filling pager.total and pager.page_count.
#
# Reading every page is all_pages: true, the next step below. It walks the pages from the first
# until the instance has no more and answers them as one list, bounded by max_rows, max_pages
# and max_total, and it fails at a cap rather than answering part of the program. For a feed
# that keeps growing, updated_after is the better bound still: it reads only what changed since
# the last run, which is bounded by the change rather than by the size of the program.
#
# page_size is also the throttle on a shared instance. A nightly extract asking for ten
# thousand rows at a time out of a national tracker program is a load decision, not a
# formatting one.
#
#   dg run --local examples/dhis2/dhis2-tracker-paged.yaml
#   dg run --local examples/dhis2/dhis2-tracker-paged.yaml -p page=2

format: dirigent/v1
kind: pipeline
code: dhis2-tracker-paged
name: Page through a tracker collection
description: Read one page of tracker events and its count, then every recent change.

tags: [dhis2, tracker]

requires:
  blocks:
    - dhis2.tracker

params:
  type: object
  properties:
    program:
      type: string
      default: IpHINAT79UW
      description: The uid of the program whose events are read.
    page:
      type: integer
      minimum: 1
      default: 1
      description: The 1-based page to read.
    page_size:
      type: integer
      minimum: 1
      maximum: 1000
      default: 100
      description: How many rows the page holds.
    updated_after:
      type: string
      default: "2024-01-01"
      description: The ISO date from which every_page reads changed events.

connections:
  dhis2-demo:
    name: DHIS2 play demo
    description: The public DHIS2 demo at play.dhis2.org, signed in with its documented demo login.
    kind: dhis2
    config:
      base_url: https://play.dhis2.org/2.43
      basic_username: admin
      basic_password: district
      timeout: 120s

steps:
  read:
    block: dhis2.tracker
    config:
      connection: dhis2-demo
      kind: events
      program: "${params.program}"
      org_unit: ImspTQPwCqd
      ou_mode: DESCENDANTS
      # Naming the columns matters most on a large page: the default projection carries the
      # whole event, data values included.
      fields: event,programStage,orgUnit,occurredAt,status
      page: "${params.page}"
      page_size: "${params.page_size}"
      total: true

  every_page:
    block: dhis2.tracker
    config:
      connection: dhis2-demo
      kind: events
      program: "${params.program}"
      org_unit: ImspTQPwCqd
      ou_mode: DESCENDANTS
      fields: event,programStage,orgUnit,occurredAt,status
      # Only the last week's changes, so every page of them is a small read.
      updated_after: "${params.updated_after}"
      all_pages: true
      page_size: "${params.page_size}"
      max_rows: 20000
      max_total: 32MB
