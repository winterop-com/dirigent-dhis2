# Export one month of a data set, then hand it straight back as a dry run.
#
# This is the native round trip: dhis2.data_value_set_export reads the values and
# dhis2.data_value_set_import rehearses writing them, with dry_run keeping the instance
# untouched. The import summary comes back parsed -- status, counts, conflicts -- so a
# real import is this document with dry_run turned off and a target connection that is
# not the shared demo.
#
# The demo shifts its data era: if the export comes back empty, ask a nearby period.
#
# The document carries no credential. It names the dhis2 connection dhis2-play, which the
# instance holds: create it once, and the command asks how to sign in. The demo takes
# the login it publishes on its own sign-in page.
#
#   dg connection create dhis2 dhis2-play --set base_url=https://play.dhis2.org/2.43 \
#       --set timeout=2m
#
#   dg run examples/dhis2/dhis2-rehearse-import.yaml
#   dg run examples/dhis2/dhis2-rehearse-import.yaml -p period=202506
#
# TO MAKE IT YOURS: create a `dhis2` connection for your own instance -- `dg connection create
# dhis2 my-dhis2 --set base_url=https://dhis2.example.org` -- and name it in a copy in place of
# `dhis2-play`. Then change the data set, period and org unit to ones your instance has, and
# turn dry_run off once the summary is what you expect.

format: dirigent/v1
kind: pipeline
code: dhis2-rehearse-import
name: Rehearse an import
description: Export one month of a data set, then hand it straight back as a dry run.

tags: [dhis2, starter]

params:
  type: object
  properties:
    period:
      type: string
      default: "202507"
      description: The ISO period to read and rehearse, such as 202507.

requires:
  blocks:
    - dhis2.data_value_set_export
    - dhis2.data_value_set_import
  connections:
    - dhis2-play

steps:
  export:
    block: dhis2.data_value_set_export
    config:
      connection: dhis2-play
      data_set: pBOMPrpg1QX
      period: ${params.period}
      org_unit: ImspTQPwCqd
      children: true
  rehearse:
    block: dhis2.data_value_set_import
    depends_on: [export]
    config:
      connection: dhis2-play
      data_values: ${steps.export.output.body}
      dry_run: true
