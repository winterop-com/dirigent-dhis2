# Let the good values through and report the bad ones, instead of refusing the batch.
#
# atomic_mode is the other half of an import's contract, and it decides what one bad row
# does to the other rows. ALL, the default, asks for all-or-nothing: a single conflict and
# the whole submission is refused. DHIS2 does not keep that promise -- on every supported
# major the good values are committed beside the conflicts under ALL -- so the block fails
# the step and names how many values landed. NONE takes every value it can and reports the
# rest as conflicts, which is the behaviour ALL delivers anyway, said out loud.
#
# NONE is for a feed you do not control -- a district's monthly file, a survey export, an
# upstream system with its own idea of a value. Refusing three hundred good values because
# one row holds a word where a count belongs serves nobody; taking the 299 and naming the one
# is the behaviour worth having, as long as something reads the conflicts afterwards.
#
# A row naming a data element outside the data set is another matter on 2.43: the instance
# checks the data set before it reads any value, and refuses the whole document as ERROR
# whatever the atomic mode. 2.42 still takes the good rows beside it.
#
# The block only fails the step on a summary DHIS2 itself calls ERROR. Under NONE a partial
# import is a WARNING with a non-zero ignored count and a populated conflicts list, and the
# step succeeds -- so the conflicts are yours to act on. steps.take.output.conflicts is
# where a downstream step reads them: each entry says what was wrong, with the instance's
# error code and the position of the refused value in the document. 2.42 also names the
# data element as the object; 2.43 leaves the object empty, so the position is what to read.
#
# The second row below holds a value the data element's type refuses, so the summary has
# something real to report on 2.42 and 2.43 alike.
#
#   dg run --local examples/dhis2/dhis2-import-partial.yaml

format: dirigent/v1
kind: pipeline
code: dhis2-import-partial
name: Import what is valid, report what is not
description: Take every acceptable data value and report the refused ones as conflicts.

tags: [dhis2]

requires:
  blocks:
    - dhis2.data_value_set_import

params:
  type: object
  properties:
    period:
      type: string
      default: "202507"
      description: The ISO period the values belong to.

connections:
  dhis2-demo:
    kind: dhis2
    config:
      base_url: https://play.im.dhis2.org/stable-2-43-2
      basic_username: admin
      basic_password: district
      timeout: 60s

steps:
  take:
    block: dhis2.data_value_set_import
    config:
      connection: dhis2-demo
      data_values:
        dataSet: BfMAe6Itzgt
        period: "${params.period}"
        orgUnit: DiszpKrYNg8
        dataValues:
          - dataElement: s46m5MS0hxu
            categoryOptionCombo: Prlt0C1RF0s
            attributeOptionCombo: HllvX50cXC0
            value: "12"
          # A real data element and category option combo, with a value its integer type
          # refuses: the row lands in conflicts rather than failing the batch.
          - dataElement: s46m5MS0hxu
            categoryOptionCombo: psbwp3CQEhs
            attributeOptionCombo: HllvX50cXC0
            value: "not-a-number"
      # Take what is valid; under the default, ALL, the row above would refuse the batch.
      atomic_mode: NONE
      dry_run: true
