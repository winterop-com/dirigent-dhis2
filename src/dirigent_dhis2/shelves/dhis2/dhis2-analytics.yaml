# The production-shaped composition: wait for the month to be signed off, rebuild the
# analytics, then export the data values -- with the deadlines, timeouts and retries a
# nightly deserves. It carries a dhis2-play connection so it runs standalone; an
# instance you own names its own connection instead. The demo-sized versions of each step
# live beside it in this directory.
#
# The export's document is the run's answer. A nightly that has to leave a file behind adds
# one storage.write step after it -- storage.write is the only block that puts a value into
# storage -- which is what dhis2-export-to-storage.yaml on the compose shelf shows.
#
# WARNING: as written the connection is the shared public demo, and run_analytics rebuilds its
# tables in full. Point dhis2-play at an instance of your own before running it.
#
# The document carries no credential. It names the dhis2 connection dhis2-play, which the
# instance holds: create it once, and the command asks how to sign in. The demo takes
# the login it publishes on its own sign-in page.
#
#   dg connection create dhis2 dhis2-play --set base_url=https://play.dhis2.org/2.43 \
#       --set timeout=2m

format: dirigent/v1
kind: pipeline
code: dhis2-analytics
name: DHIS2 analytics pull
description: Wait for a data set sign-off, rebuild analytics, then export the data values.

tags: [dhis2]

requires:
  blocks:
    - dhis2.analytics_run
    - dhis2.data_value_set_export
    - dhis2.data_set_complete
  connections:
    - dhis2-play

params:
  type: object
  required: [period]
  properties:
    period:
      type: string
      description: An ISO period identifier, such as 2026Q1.
    org_unit:
      type: string
      default: ImspTQPwCqd

steps:
  wait_for_completion:
    block: dhis2.data_set_complete
    poll: 15m
    deadline: 48h
    on_timeout: skip
    config:
      connection: dhis2-play
      data_set: pBOMPrpg1QX
      period: "${params.period}"
      org_unit: "${params.org_unit}"

  run_analytics:
    block: dhis2.analytics_run
    depends_on: [wait_for_completion]
    timeout: 4h
    retry:
      max_attempts: 2
      backoff: 10m
    config:
      connection: dhis2-play
      skip_resource_tables: false

  export_values:
    block: dhis2.data_value_set_export
    depends_on: [run_analytics]
    config:
      connection: dhis2-play
      data_set: pBOMPrpg1QX
      period: "${params.period}"
      org_unit: "${params.org_unit}"
