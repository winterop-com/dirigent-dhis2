# Read a page of tracker events for one program out of the demo.
#
# dhis2.tracker reads /api/tracker/events scoped to a program and an org unit subtree. The
# `kind` chooses the collection -- trackedEntities, enrollments, or events -- and the query
# params narrow it the way the capture app does. The parsed page comes back inline.
#
# The document carries no credential. It names the dhis2 connection dhis2-play, which the
# instance holds: create it once, and the command asks how to sign in. The demo takes
# the login it publishes on its own sign-in page.
#
#   dg connection create dhis2 dhis2-play --set base_url=https://play.dhis2.org/2.43 \
#       --set timeout=2m
#
#   dg run examples/dhis2/dhis2-tracker-events.yaml

format: dirigent/v1
kind: pipeline
code: dhis2-tracker-events
name: Read DHIS2 tracker events
description: Read a page of tracker events for the child programme from the demo instance.

tags: [dhis2]

requires:
  blocks:
    - dhis2.tracker
  connections:
    - dhis2-play

steps:
  read:
    block: dhis2.tracker
    config:
      connection: dhis2-play
      kind: events
      program: IpHINAT79UW
      org_unit: ImspTQPwCqd
      ou_mode: DESCENDANTS
      fields: event,programStage,orgUnit,occurredAt,status
      page_size: 50
