# Verify data-element metadata against a schema carried in the document.
#
# The fields= projection asks for id, name, valueType and domainType, and the carried schema
# pins the id to the DHIS2 UID pattern and valueType and domainType to the enums DHIS2 uses --
# so a value outside the known set, not just a missing field, is caught at the boundary. The
# shape travels in the document's own top-level schemas: section, so the whole thing runs on
# its own with no schema to hand it. The paired data-elements-named.yaml runs the very same
# check against a schema the instance holds: only the schema's location differs.
#
#   dg run --local examples/validate/data-elements-carried.yaml

format: dirigent/v1
kind: pipeline
code: data-elements-carried
name: Data elements, checked against a carried schema
description: Fetch DHIS2 data elements with a fields projection, and validate their types against a carried schema.

tags: [dhis2, validate, http]

requires:
  blocks:
    - http.request
    - validate.schema

connections:
  dhis2-demo:
    name: DHIS2 play demo
    description: The public DHIS2 demo at play.dhis2.org, signed in with its documented demo login.
    kind: http
    config:
      base_url: https://play.dhis2.org/2.42
      follow_redirects_with_auth: true
      basic_username: admin
      basic_password: district
      timeout: 1m

schemas:
  dhis2-data-elements:
    title: DHIS2 data elements
    description: "The shape a GET /api/dataElements.json?fields=id,name,valueType,domainType returns: items whose valueType and domainType are drawn from the DHIS2 enumerations, caught here before a downstream step reads a value that moved."
    type: object
    required: [dataElements]
    properties:
      dataElements:
        type: array
        items:
          type: object
          required: [id, name, valueType, domainType]
          properties:
            id: { type: string, pattern: "^[A-Za-z][A-Za-z0-9]{10}$" }
            name: { type: string }
            domainType: { enum: [AGGREGATE, TRACKER] }
            valueType:
              enum: [TEXT, LONG_TEXT, MULTI_TEXT, LETTER, PHONE_NUMBER, EMAIL, BOOLEAN, TRUE_ONLY,
                     DATE, DATETIME, TIME, NUMBER, UNIT_INTERVAL, PERCENTAGE, INTEGER,
                     INTEGER_POSITIVE, INTEGER_NEGATIVE, INTEGER_ZERO_OR_POSITIVE, TRACKER_ASSOCIATE,
                     USERNAME, COORDINATE, ORGANISATION_UNIT, REFERENCE, AGE, URL, FILE_RESOURCE,
                     IMAGE, GEOJSON]

steps:
  fetch:
    block: http.request
    config:
      connection: dhis2-demo
      path: /api/dataElements.json
      method: GET
      query:
        fields: id,name,valueType,domainType
        paging: false
  check:
    block: validate.schema
    depends_on: [fetch]
    config:
      input: ${steps.fetch.output.body}
      schema: dhis2-data-elements
