# Verify data-element metadata against the dhis2-data-elements instance schema.
#
# The same check as data-elements-carried.yaml, written the other way: rather than carrying
# the shape, the gate names dhis2-data-elements, a schema the instance holds. The document
# stays short, the shape lives in one place many pipelines can point at, and requires.schemas
# refuses the document on an instance that does not hold it.
#
# The document carries no credential. It names the http connection dhis2-play-http, which the
# instance holds: create it once, and the command asks how to sign in. The demo takes
# the login it publishes on its own sign-in page.
#
#   dg connection create http dhis2-play-http --set base_url=https://play.dhis2.org/2.43 \
#       --set follow_redirects_with_auth=true --set timeout=2m
#
#   dg schema create examples/schemas/dhis2-data-elements.json
#   dg run examples/validate/data-elements-named.yaml

format: dirigent/v1
kind: pipeline
code: data-elements-named
name: Data elements, checked against a named schema
description: |
  Fetch DHIS2 data elements and check them against a schema the instance holds.

  The schema is `dhis2-data-elements`.

tags: [dhis2, validate, http]

requires:
  blocks:
    - http.request
    - validate.schema
  schemas:
    - dhis2-data-elements
  connections:
    - dhis2-play-http

steps:
  fetch:
    block: http.request
    config:
      connection: dhis2-play-http
      path: /api/dataElements.json
      method: GET
      query:
        fields: id,name,valueType,domainType
        paging: false
  check:
    block: validate.schema
    depends_on: [fetch]
    config:
      input: ${steps.fetch.output.body}
      schema: dhis2-data-elements
