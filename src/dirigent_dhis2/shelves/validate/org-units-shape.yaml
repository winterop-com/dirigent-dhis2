# Verify organisation-unit metadata against the dhis2-org-units instance schema.
#
# A metadata read is a contract with a system you do not control: the fields= projection asks
# for exactly id, displayName and level, and the gate validates the response against the
# dhis2-org-units schema the instance holds. If DHIS2 renames a field or changes a type, the
# run fails HERE naming the path, not later where a reader reads a field that moved. requires
# names the schema, so an instance without it refuses the document.
#
# The document carries no credential. It names the http connection dhis2-play-http, which the
# instance holds: create it once, and the command asks how to sign in. The demo takes
# the login it publishes on its own sign-in page.
#
#   dg connection create http dhis2-play-http --set base_url=https://play.dhis2.org/2.43 \
#       --set follow_redirects_with_auth=true --set timeout=2m
#
#   dg schema create examples/schemas/dhis2-org-units.json
#   dg run examples/validate/org-units-shape.yaml

format: dirigent/v1
kind: pipeline
code: org-units-shape
name: Org units, shape-checked
description: |
  Fetch DHIS2 organisation units and check the shape of the response.

  The read uses a `fields` projection, and the `dhis2-org-units` schema the instance holds checks
  the answer.

tags: [dhis2, validate, http]

requires:
  blocks:
    - http.request
    - validate.schema
  schemas:
    - dhis2-org-units
  connections:
    - dhis2-play-http

steps:
  fetch:
    block: http.request
    config:
      connection: dhis2-play-http
      path: /api/organisationUnits.json
      method: GET
      query:
        fields: id,displayName,level
        paging: false
        order: displayName:asc
  check:
    block: validate.schema
    depends_on: [fetch]
    config:
      input: ${steps.fetch.output.body}
      schema: dhis2-org-units
