# Narrow a read with a filter, then sharpen the result with an instance schema.
#
# The filter query parameter narrows what DHIS2 returns -- valueType:eq:NUMBER asks the server
# for the NUMBER-valued data elements alone. The dhis2-number-data-elements schema the instance
# holds then sharpens: it pins valueType to exactly NUMBER, so if the filter is ever dropped or
# ignored, a non-NUMBER element fails the gate rather than slipping through. The narrow is an
# optimisation; the sharpen is the guarantee.
#
# The document carries no credential. It names the http connection dhis2-play-http, which the
# instance holds: create it once, and the command asks how to sign in. The demo takes
# the login it publishes on its own sign-in page.
#
#   dg connection create http dhis2-play-http --set base_url=https://play.dhis2.org/2.43 \
#       --set follow_redirects_with_auth=true --set timeout=2m
#
#   dg schema create examples/schemas/dhis2-number-data-elements.json
#   dg run examples/validate/numbers-only.yaml

format: dirigent/v1
kind: pipeline
code: numbers-only
name: Data elements, NUMBER only
description: |
  Fetch only number-valued data elements and check that none slipped through.

  A DHIS2 filter, `valueType:eq:NUMBER`, narrows the read, and the `dhis2-number-data-elements`
  schema proves none slipped through.

tags: [dhis2, validate, http]

requires:
  blocks:
    - http.request
    - validate.schema
  schemas:
    - dhis2-number-data-elements
  connections:
    - dhis2-play-http

steps:
  fetch:
    block: http.request
    config:
      connection: dhis2-play-http
      path: /api/dataElements.json
      method: GET
      query:
        fields: id,name,valueType
        filter: valueType:eq:NUMBER
        paging: false
  check:
    block: validate.schema
    depends_on: [fetch]
    config:
      input: ${steps.fetch.output.body}
      schema: dhis2-number-data-elements
